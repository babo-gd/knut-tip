<script>
/* GitHub Pages lets browsers keep pages for 10 minutes. This small page always fetches the newest app.html, so every visit shows the latest version. */
fetch("app.html?t=" + Date.now(), {cache: "no-store"})
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (html) { document.open(); document.write(html); document.close(); })
  .catch(function () { location.replace("app.html"); });
</script>
<noscript><a href="app.html">넛팁 열기</a></noscript>
